<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ece7ff">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>오픈놀 커리어링크</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#ece7ff 0,#f6f3ff 220px,#f9f8ff 520px) no-repeat,#f9f8ff;color:#26223d;
  font-family:"IBM Plex Sans KR",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.7;padding:16px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#8b7bff,#6c5ce7);color:#fff;display:grid;place-items:center;font-weight:700;box-shadow:0 4px 12px rgba(108,92,231,.3)}
.brand b{display:block}.brand small{display:block;font-size:11px;color:#938eaa}
.card{background:#fff;border:1px solid #ece9f6;border-radius:18px;padding:22px 18px;box-shadow:0 1px 2px rgba(70,50,170,.04),0 8px 24px rgba(70,50,170,.07)}
h1{font-size:19px;margin:0 0 8px}
p{margin:0;color:#625d7c}
.foot{font-size:12px;color:#938eaa;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand"><span class="logo" aria-hidden="true">O</span><span><b>오픈놀 커리어링크</b><small>수료생 사후관리</small></span></header>
  <section class="card">
    <h1>참여자 페이지를 준비하고 있습니다</h1>
    <p>설문에 참여하시려면 메일이나 문자로 받으신 <b>개인 설문 링크</b>를 눌러 들어와 주세요.</p>
    <p style="margin-top:8px">링크를 잃어버리셨다면 담당자에게 문의해 주세요.</p>
  </section>
  <p class="foot">오픈놀 커리어성장사업부</p>
</div>
</body>
</html>
