<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ece7ff">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co ; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<script>if (window.top !== window.self) { window.top.location = window.self.location; }</script>
<title>오픈놀 커리어링크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 참여자 페이지: 휴대전화 한 손 사용 기준 한 줄 배치. 관리자 페이지와 같은 보라 톤 */
:root{
  /* 밝은 화면만 사용 (휴대폰이 다크 모드여도 밝게 보임) */
  color-scheme:light;
  --bg:#f9f8ff; --surface:#ffffff; --surface-2:#f7f5ff; --ink:#26223d; --sub:#625d7c; --faint:#938eaa;
  --line:#ece9f6; --line-strong:#dcd7ee;
  --accent:#6c5ce7; --accent-deep:#5443d6; --accent-soft:#f0edff; --on-accent:#ffffff;
  --good:#0d7d60; --good-soft:#e3f7ef; --warn:#8f620c; --warn-soft:#fff4dc; --bad:#b03f3f; --bad-soft:#fdeaea;
  --shadow:0 1px 2px rgba(70,50,170,.04),0 8px 24px rgba(70,50,170,.07);
  --f-body:"IBM Plex Sans KR",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(180deg,#ece7ff 0,#f6f3ff 220px,var(--bg) 520px) no-repeat,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.env{border:1px solid #f6e3b4;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:12.5px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#8b7bff,#6c5ce7);box-shadow:0 4px 12px rgba(108,92,231,.3);color:var(--on-accent);display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px}
.brand small{display:block;font-size:11px;color:var(--faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card h2{font-size:17px}
.card p{margin:0;color:var(--sub);font-size:14px}
.muted{color:var(--sub);font-size:13.5px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:1px solid var(--accent);background:linear-gradient(135deg,#7d6dff,#6c5ce7);box-shadow:0 4px 12px rgba(108,92,231,.22);color:var(--on-accent);border-radius:12px;padding:11px 16px;font-weight:600;min-height:46px}
.btn:hover{background:var(--accent-deep)}
.btn.ghost{background:var(--surface);box-shadow:none;color:var(--accent-deep);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.link{border:0;background:none;color:var(--accent-deep);padding:0;text-decoration:underline;text-underline-offset:3px}
.f{display:flex;flex-direction:column;gap:6px}
.f label,.f .lbl{font-weight:600;font-size:14px}
.f .hint{font-size:12.5px;color:var(--faint)}
.input,.select,.textarea{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:46px}
.textarea{min-height:90px;resize:vertical}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13.5px}
.ok{background:var(--good-soft);color:var(--good);border-radius:10px;padding:10px 12px;font-size:13.5px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px}
.tabs{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:9px;font-weight:600;color:var(--sub)}
.tabs button.on{background:var(--surface);color:var(--accent-deep);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;border:1px solid var(--line-strong);border-radius:99px;padding:8px 14px;font-size:14px;background:var(--surface)}
.chip input:checked + span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);font-weight:600}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.q{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q .qt{font-weight:700;font-size:15.5px}
.q .qt small{font-weight:500;color:var(--faint);font-size:12.5px;margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--sub)}
.state{display:inline-block;font-size:12.5px;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--accent-soft);color:var(--accent-deep)}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc div{border:1px solid transparent;border-radius:14px;padding:13px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px}
.svc div:nth-child(5n+1){background:#f1eeff}.svc div:nth-child(5n+2){background:#e8f7f1}.svc div:nth-child(5n+3){background:#fff3e6}
.svc div:nth-child(5n+4){background:#e9f3ff}.svc div:nth-child(5n){background:#fff8d9}.svc .tag{background:rgba(255,255,255,.75);border-color:transparent}
.svc b{font-size:14px}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.list li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--sub)}
dl.kv dd{margin:0;overflow-wrap:anywhere}
details.terms{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--sub)}
details.terms summary{cursor:pointer;color:var(--ink);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.foot{font-size:12px;color:var(--faint);text-align:center}
[hidden]{display:none !important}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>document.write('<script src="config.js?v=' + Date.now() + '"><\/script>');</script>
<script>
'use strict';
/* =====================================================================
   오픈놀 커리어링크 참여자 페이지
   · 로그인: Supabase Auth (이메일 + 비밀번호). 로그인 정보는 이 탭에만 보관(sessionStorage)
   · 데이터: p_ 로 시작하는 DB 함수만 사용 → 로그인한 본인 정보만 조회·저장 (DB가 다시 확인)
   · 공개 키만 사용합니다. 비밀 키(service_role/secret)가 들어 있으면 열리지 않습니다.
   ===================================================================== */
const CFG = window.CAREERLINK_CONFIG || {};
const $ = s => document.querySelector(s);
const E = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmtD = s => { if(!s) return ''; const d = new Date(s); return isNaN(d) ? String(s) : `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`; };
const STATUS = {seeking:'구직 중', employed:'재직 중', startup:'창업', education:'진학·교육 중', other:'기타', unknown:'미확인'};
const JOBS = ['마케팅·홍보','기획·PM','개발·데이터','디자인','경영지원·인사','영업·MD','교육·서비스'];
const INTERESTS = ['IT·플랫폼','제조·생산','유통·커머스','금융·보험','교육','공공·비영리','미디어·콘텐츠','의료·바이오'];
const STAGES = ['직무 탐색','취업 준비','입사 1년 미만','경력 1~3년','경력 3년 이상','이직 준비'];
const SUPPORTS = ['채용공고 큐레이션','맞춤 프로그램 안내','취업 컨설팅(서류·면접)','직장 적응 지원(온보딩 케어)','커리어 성장 로드맵','청년 정책 안내'];
const EMP_TYPES = ['정규직','계약직','인턴','프리랜서','일용직','기타'];
const AFTERCARE = {yes:'참여하겠습니다', no:'참여하지 않겠습니다', later:'나중에 결정하겠습니다'};
const SERVICES = {
  seeker: [['채용공고 큐레이션','희망 직무에 맞춘 공고'],['맞춤 프로그램 소개','오픈놀 교육·일경험 프로그램'],['청년 정책 소개','지원금·주거·교통 등'],['취업 컨설팅','서류·면접 준비']],
  worker: [['채용공고 큐레이션','경력·이직 공고'],['맞춤 프로그램 소개','재직자 교육 프로그램'],['직장 적응 지원','온보딩 케어'],['커리어 성장 로드맵','경력 단계별 필요 역량'],['청년 정책 소개','재직 청년 지원 제도']]
};
const FIELD_KO = {current_status:'현재 상태', desired_job:'희망 직무', phone:'휴대전화', email:'이메일', consent_marketing:'마케팅 수신 동의', employment:'현재 직장', employment_end:'이전 직장 종료'};

const st = {me:null, view:'home', authMode:'login', authMsg:'', authErr:'', busy:false, err:'', msg:'', reqOpen:false, done:null, history:null, recovery:false, email:''};

/* ---------- Supabase ---------- */
let sb = null, setupErr = '';
(function(){
  const key = String(CFG.SUPABASE_ANON_KEY || '');
  if(!CFG.SUPABASE_URL || !key){ setupErr = '연결 설정(config.js)이 비어 있습니다. 담당자에게 알려 주세요.'; return; }
  const secret = key.startsWith('sb_secret_') || (() => { try{ return JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role === 'service_role'; }catch{ return false; } })();
  if(secret){ setupErr = '연결 설정에 비밀 키가 들어 있어 페이지를 열지 않았습니다. 담당자에게 알려 주세요.'; return; }
  if(!window.supabase){ setupErr = '필요한 파일을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.'; return; }
  let storage; try{ sessionStorage.setItem('clp.t','1'); sessionStorage.removeItem('clp.t'); storage = sessionStorage; }catch{ storage = undefined; }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storage, storageKey:'careerlink-participant-auth'}});
})();
const friendly = m => {
  m = String(m || '');
  if(/Invalid login credentials/i.test(m)) return '이메일 또는 비밀번호가 맞지 않습니다.';
  if(/Email not confirmed/i.test(m)) return '메일함에서 가입 인증을 먼저 완료해 주세요.';
  if(/already registered|already been registered/i.test(m)) return '이미 가입된 이메일입니다. 로그인하거나 비밀번호 찾기를 이용해 주세요.';
  if(/Password should be|weak/i.test(m)) return '비밀번호는 8자 이상, 영문과 숫자를 섞어 주세요.';
  if(/Signups not allowed|signup.*disabled/i.test(m)) return '지금은 가입을 받지 않고 있습니다. 담당자에게 문의해 주세요.';
  if(/rate limit|too many/i.test(m)) return '요청이 많아 잠시 막혔습니다. 몇 분 뒤 다시 시도해 주세요.';
  if(/JWT|token|session/i.test(m)) return '로그인이 만료되었습니다. 다시 로그인해 주세요.';
  if(/Failed to fetch|NetworkError/i.test(m)) return '서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.';
  return m;
};
async function rpc(fn, args){ const {data, error} = await sb.rpc(fn, args || {}); if(error) throw Error(friendly(error.message)); return data; }
const pageUrl = () => location.origin + location.pathname;

/* ---------- 화면 ---------- */
function render(){
  const app = $('#app');
  const env = CFG.ENV_LABEL ? `<div class="env"><b>${E(CFG.ENV_LABEL)}</b> · 실제 개인정보를 입력하지 마세요</div>` : '';
  if(setupErr) return app.innerHTML = env + topBar(false) + `<div class="card"><div class="err">${E(setupErr)}</div></div>`;
  let body;
  if(st.recovery) body = newPwView();
  else if(!st.me) body = authView();
  else if(st.view === 'survey') body = surveyView();
  else if(st.view === 'done') body = doneView();
  else if(st.view === 'history') body = historyView();
  else if(st.view === 'consent') body = consentView();
  else body = homeView();
  app.innerHTML = env + topBar(!!st.me) + body + `<p class="foot">오픈놀 커리어성장사업부 · 문의는 담당자에게 연락해 주세요</p>`;
}
function topBar(inSession){
  return `<header class="top"><div class="brand"><span class="logo" aria-hidden="true">O</span><span><b>오픈놀 커리어링크</b><small>수료생 사후관리</small></span></div>
    ${inSession ? `<button class="btn ghost sm" type="button" data-act="logout">로그아웃</button>` : ''}</header>`;
}
function authView(){
  const m = st.authMode;
  const tabs = `<div class="tabs" role="tablist"><button type="button" role="tab" class="${m === 'login' ? 'on' : ''}" data-mode="login">로그인</button><button type="button" role="tab" class="${m === 'signup' ? 'on' : ''}" data-mode="signup">회원가입</button></div>`;
  const msg = (st.authErr ? `<div class="err" role="alert">${E(st.authErr)}</div>` : '') + (st.authMsg ? `<div class="ok" role="status">${E(st.authMsg)}</div>` : '');
  if(m === 'reset') return `<section class="card"><h2>비밀번호 찾기</h2><p>가입한 이메일로 비밀번호를 새로 정하는 링크를 보내드립니다.</p>${msg}
    <form id="resetForm" class="card" style="padding:0;border:0" novalidate><div class="f"><label for="r-email">이메일</label><input class="input" id="r-email" name="email" type="email" autocomplete="email" value="${E(st.email)}" required></div>
    <button class="btn full" type="submit">링크 보내기</button></form><button class="link" type="button" data-mode="login">로그인으로 돌아가기</button></section>`;
  return `<section class="card"><h2>${m === 'signup' ? '처음 오셨나요?' : '수료생 로그인'}</h2>
    <p>${m === 'signup' ? '자주 쓰는 이메일로 가입하세요. 가입 후 담당자에게 받은 연결 코드로 내 정보와 연결합니다.' : '오픈놀 프로그램 수료생을 위한 취업 현황 조사와 사후관리 서비스입니다.'}</p>
    ${tabs}${msg}
    <form id="${m === 'signup' ? 'signupForm' : 'loginForm'}" class="card" style="padding:0;border:0" novalidate>
      <div class="f"><label for="a-email">이메일</label><input class="input" id="a-email" name="email" type="email" autocomplete="email" value="${E(st.email)}" required></div>
      <div class="f"><label for="a-pw">비밀번호</label><input class="input" id="a-pw" name="pw" type="password" autocomplete="${m === 'signup' ? 'new-password' : 'current-password'}" required>${m === 'signup' ? '<span class="hint">8자 이상, 영문과 숫자를 섞어 주세요</span>' : ''}</div>
      ${m === 'signup' ? `<div class="f"><label for="a-pw2">비밀번호 확인</label><input class="input" id="a-pw2" name="pw2" type="password" autocomplete="new-password" required></div>` : ''}
      <button class="btn full" type="submit" ${st.busy ? 'disabled' : ''}>${m === 'signup' ? '가입하기' : '로그인'}</button>
    </form>
    ${m === 'login' ? `<button class="link" type="button" data-mode="reset">비밀번호를 잊으셨나요?</button>` : ''}</section>`;
}
function newPwView(){
  return `<section class="card"><h2>새 비밀번호 정하기</h2>${st.authErr ? `<div class="err">${E(st.authErr)}</div>` : ''}
    <form id="newPwForm" class="card" style="padding:0;border:0" novalidate><div class="f"><label for="n-pw">새 비밀번호</label><input class="input" id="n-pw" name="pw" type="password" autocomplete="new-password"><span class="hint">8자 이상, 영문과 숫자를 섞어 주세요</span></div>
    <div class="f"><label for="n-pw2">새 비밀번호 확인</label><input class="input" id="n-pw2" name="pw2" type="password" autocomplete="new-password"></div><button class="btn full" type="submit">저장</button></form></section>`;
}
function banner(){ return (st.err ? `<div class="err" role="alert">${E(st.err)}</div>` : '') + (st.msg ? `<div class="ok" role="status">${E(st.msg)}</div>` : ''); }

function homeView(){
  const me = st.me, p = me.participant, cy = me.cycle;
  let link = '';
  if(!me.linked){
    const rq = me.request;
    link = `<section class="card"><h2>내 정보와 연결하기</h2>
      <p>담당자가 문자로 보낸 <b>연결 코드</b>와 생년월일을 입력하면 수료생 정보와 연결됩니다. 연결 전에는 다른 사람의 정보가 보이지 않도록 내 정보도 보이지 않습니다.</p>

function readSurvey(f){
  const fd = new FormData(f); const g = k => String(fd.get(k) || '').trim(); const all = k => fd.getAll(k).map(String);
  const jobsOther = g('desired_jobs_other').split(',').map(s => s.trim()).filter(Boolean);
  const v = {status:g('status'), status_other:g('status_other'), desired_jobs:[...all('desired_jobs'), ...jobsOther].slice(0, 3), desired_jobs_other:g('desired_jobs_other'),
    company:g('company'), job_title:g('job_title'), employment_type:g('employment_type'), start_date:g('start_date'), work_region:g('work_region'),
    interests:all('interests'), interests_other:g('interests_other'), career_stage:g('career_stage'), supports:all('supports'), supports_other:g('supports_other'),
    aftercare:g('aftercare'), phone:g('phone'), email:g('email'), comment:g('comment'), privacy:fd.get('privacy') === '1', marketing:g('marketing')};
  if(v.supports_other) v.supports = [...v.supports, '기타: ' + v.supports_other];
  if(v.interests_other) v.interests = [...v.interests, v.interests_other];
  return v;
}
function checkSurvey(v){
  if(!v.status) return '1번 현재 상태를 골라 주세요.';
  if(v.status === 'other' && !v.status_other) return '1번 기타 상태를 적어 주세요.';
  if(!v.desired_jobs.length) return '2번 희망 직무를 하나 이상 골라 주세요.';
  if([...document.querySelectorAll('[name=desired_jobs]:checked')].length > 3) return '2번 희망 직무는 3개까지 고를 수 있습니다.';
  if(!v.career_stage) return '5번 현재 커리어 단계를 골라 주세요.';
  if(!v.supports.length) return '6번 필요한 지원 서비스를 하나 이상 골라 주세요.';
  if(!v.aftercare) return '7번 사후관리 참여 희망을 골라 주세요.';
  if(v.phone && !/^01[016789]-?\d{3,4}-?\d{4}$/.test(v.phone.replace(/\s/g, ''))) return '8번 휴대전화 번호를 확인해 주세요. 예: 010-1234-5678';
  if(v.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) return '8번 이메일 형식을 확인해 주세요.';
  if(!v.privacy) return '10번 필수 개인정보 수집·이용에 동의해야 제출할 수 있습니다.';
  return '';
}

  if(t.dataset.mode){ st.authMode = t.dataset.mode; st.authErr = ''; st.authMsg = ''; return render(); }
  const a = t.dataset.act;
  if(a === 'logout'){ await sb.auth.signOut({scope:'local'}); Object.assign(st, {me:null, view:'home', draft:null, authMode:'login', authMsg:'로그아웃했습니다.', authErr:''}); return render(); }
  if(a === 'home'){ st.view = 'home'; st.err = ''; st.msg = ''; try{ await loadMe(); }catch(e){ st.err = e.message; } render(); return window.scrollTo(0, 0); }
  if(a === 'survey'){ st.view = 'survey'; st.draft = null; st.err = ''; render(); return window.scrollTo(0, 0); }
  if(a === 'history'){ st.view = 'history'; st.history = null; render(); try{ st.history = await rpc('p_my_responses'); }catch(e){ st.history = []; st.err = e.message; } return render(); }
  if(a === 'consent'){ st.view = 'consent'; st.err = ''; st.msg = ''; return render(); }
  if(a === 'req-toggle'){ st.reqOpen = !st.reqOpen; return render(); }
  if(t.dataset.mk){ t.disabled = true; try{ st.me = await rpc('p_set_marketing', {agree: t.dataset.mk === '1'}); st.msg = '설정을 바꿨습니다.'; st.err = ''; }catch(e){ st.err = e.message; } return render(); }
});
document.addEventListener('change', ev => {
  if(ev.target.name === 'desired_jobs'){ const n = document.querySelectorAll('[name=desired_jobs]:checked').length; if(n > 3){ ev.target.checked = false; const e = $('#s-err'); if(e) e.innerHTML = '<div class="err">희망 직무는 3개까지 고를 수 있습니다.</div>'; } }
});
document.addEventListener('input', ev => {
  if(ev.target.id === 'c-code'){ const v = ev.target.value.toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 8); ev.target.value = v.length > 4 ? v.slice(0, 4) + '-' + v.slice(4) : v; }
  if(['c-birth','q-birth'].includes(ev.target.id)){ const d = ev.target.value.replace(/\D/g, '').slice(0, 6); ev.target.value = d.length > 4 ? `${d.slice(0,2)}-${d.slice(2,4)}-${d.slice(4)}` : d.length > 2 ? `${d.slice(0,2)}-${d.slice(2)}` : d; }
});
async function handle(f){
  const fd = new FormData(f); const g = k => String(fd.get(k) || '').trim();
  if(f.id === 'loginForm'){
    st.email = g('email'); st.authErr = ''; st.authMsg = '';
    if(!st.email || !g('pw')){ st.authErr = '이메일과 비밀번호를 입력해 주세요.'; return render(); }
    const {error} = await sb.auth.signInWithPassword({email:st.email, password:fd.get('pw')});
    if(error){ st.authErr = friendly(error.message); return render(); }
    return afterLogin();
  }
  if(f.id === 'signupForm'){
    st.email = g('email'); st.authErr = ''; st.authMsg = ''; const pw = String(fd.get('pw') || '');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(st.email)){ st.authErr = '이메일 형식을 확인해 주세요.'; return render(); }
    if(pw.length < 8 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw)){ st.authErr = '비밀번호는 8자 이상, 영문과 숫자를 섞어 주세요.'; return render(); }
    if(pw !== fd.get('pw2')){ st.authErr = '비밀번호 확인이 다릅니다.'; return render(); }
    const {data, error} = await sb.auth.signUp({email:st.email, password:pw, options:{emailRedirectTo:pageUrl()}});
    if(error){ st.authErr = friendly(error.message); return render(); }
    if(data.session) return afterLogin();
    st.authMode = 'login'; st.authMsg = `${st.email}로 인증 메일을 보냈습니다. 메일의 링크를 누른 뒤 로그인해 주세요.`; return render();
  }
  if(f.id === 'resetForm'){
    st.email = g('email'); st.authErr = '';
    if(!st.email){ st.authErr = '이메일을 입력해 주세요.'; return render(); }
    const {error} = await sb.auth.resetPasswordForEmail(st.email, {redirectTo:pageUrl()});
    if(error){ st.authErr = friendly(error.message); return render(); }
    st.authMsg = '가입한 이메일이면 비밀번호 재설정 링크가 도착합니다. 메일함을 확인해 주세요.'; return render();
  }
  if(f.id === 'newPwForm'){
    const pw = String(fd.get('pw') || ''); st.authErr = '';
    if(pw.length < 8 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw)){ st.authErr = '비밀번호는 8자 이상, 영문과 숫자를 섞어 주세요.'; return render(); }
    if(pw !== fd.get('pw2')){ st.authErr = '비밀번호 확인이 다릅니다.'; return render(); }
    const {error} = await sb.auth.updateUser({password:pw});
    if(error){ st.authErr = friendly(error.message); return render(); }
    st.recovery = false; history.replaceState(null, '', pageUrl()); return afterLogin();
  }
  if(f.id === 'codeForm'){
    st.err = ''; st.msg = '';
    if(g('code').replace(/[^0-9A-Za-z]/g, '').length !== 8){ st.err = '연결 코드 8자리를 입력해 주세요.'; return render(); }
    if(g('birth').replace(/\D/g, '').length !== 6){ st.err = '생년월일을 YY-MM-DD로 입력해 주세요. 예: 98-03-15'; return render(); }
    try{ const r = await rpc('p_link_with_code', {code:g('code'), birth:g('birth')});
      if(r.ok === false){ st.err = r.message; return render(); }
      st.me = r; st.msg = '내 정보와 연결되었습니다.'; }catch(e){ st.err = e.message; }
    return render();
  }
  if(f.id === 'reqForm'){
    st.err = ''; st.msg = '';
    try{ st.me = await rpc('p_request_link', {req:{name:g('name'), birth:g('birth'), phone:g('phone'), program:g('program'), message:g('message')}}); st.reqOpen = false; st.msg = '연결 요청을 보냈습니다. 담당자가 확인하면 연결됩니다.'; }
    catch(e){ st.err = e.message; }
    return render();
  }
  if(f.id === 'surveyForm'){
    const v = readSurvey(f); st.draft = v; const bad = checkSurvey(v);
    if(bad){ $('#s-err').innerHTML = `<div class="err" role="alert">${E(bad)}</div>`; $('#s-err').scrollIntoView({block:'center'}); return; }
    const ans = {...v, consent:{privacy:true, marketing: v.marketing === 'Y' ? true : v.marketing === 'N' ? false : null}};
    delete ans.privacy; delete ans.marketing;
    try{ const r = await rpc('p_submit_survey', {ans}); st.me = r.me; st.done = r; st.view = 'done'; st.draft = null; render(); window.scrollTo(0, 0); }
    catch(e){ $('#s-err').innerHTML = `<div class="err" role="alert">${E(e.message)}</div>`; }
    return;
  }
}
document.addEventListener('submit', async ev => {
  ev.preventDefault(); const f = ev.target; if(f.dataset.busy) return; f.dataset.busy = '1';
  const btns = [...f.querySelectorAll('button[type=submit]')]; btns.forEach(b => { b.disabled = true; b.dataset.label = b.textContent; b.textContent = '처리 중…'; });
  try{ await handle(f); } catch(e){ st.err = e.message; render(); }
  finally{ delete f.dataset.busy; if(f.isConnected) btns.forEach(b => { b.disabled = false; b.textContent = b.dataset.label; }); }
});
// 30분 동안 아무 동작이 없으면 로그아웃 (공용 PC 대비)
let lastAct = Date.now(); ['click','keydown','touchstart'].forEach(n => document.addEventListener(n, () => lastAct = Date.now(), {passive:true}));
setInterval(async () => { if(st.me && Date.now() - lastAct > 30 * 60 * 1000){ await sb.auth.signOut({scope:'local'}); Object.assign(st, {me:null, view:'home', authMode:'login', authMsg:'30분 동안 사용하지 않아 로그아웃했습니다.'}); render(); } }, 30000);

(async function boot(){
  render();
  if(!sb) return;
  sb.auth.onAuthStateChange((event) => { if(event === 'PASSWORD_RECOVERY'){ st.recovery = true; st.authErr = ''; render(); } });
  if(/type=recovery/.test(location.hash)) st.recovery = true;
  const {data} = await sb.auth.getSession();
  if(data.session && !st.recovery) return afterLogin();
  render();
})();
</script>
